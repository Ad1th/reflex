<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reflex architecture</title>
<style>
  * { margin:0; box-sizing:border-box; }
  body { background:#fff; width:1500px; height:820px; padding:56px 64px; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color:#111; }
  h1 { font-size:22px; font-weight:600; }
  p { font-size:14px; color:#555; margin-top:6px; }
  svg { margin-top:36px; }
  rect { fill:#fff; stroke:#111; stroke-width:1.25; }
  line, path { stroke:#111; stroke-width:1.25; fill:none; }
  .d { stroke-dasharray:5 4; }
  text { font-size:15px; fill:#111; }
  .n { font-size:12.5px; fill:#555; }
  .lab { font-size:12.5px; fill:#111; font-style:italic; }
</style>
</head>
<body>
<h1>Reflex architecture</h1>
<p>Every step: look up a remembered step in Moss. If it passes the checks, replay it. Otherwise ask the LLM and remember the result.</p>
<svg width="1372" height="620" viewBox="0 0 1372 620">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9" style="stroke:#111;stroke-width:1.3;fill:none"/></marker>
  </defs>

  <!-- column labels -->
  <text class="n" x="0" y="12">BROWSER</text>
  <text class="n" x="480" y="12">SERVER (Node, long-running)</text>
  <line class="d" x1="430" y1="0" x2="430" y2="620"/>

  <!-- browser -->
  <rect x="0" y="40" width="360" height="80"/>
  <text x="20" y="74">Web app</text>
  <text class="n" x="20" y="98">the page the agent operates (DOM)</text>

  <rect x="0" y="250" width="360" height="120"/>
  <text x="20" y="284">Agent loop</text>
  <text class="n" x="20" y="308">1. snapshot page → state text</text>
  <text class="n" x="20" y="328">2. look up reflex</text>
  <text class="n" x="20" y="348">3. act, then check where it landed</text>

  <!-- server -->
  <rect x="480" y="250" width="220" height="120"/>
  <text x="500" y="284">Embedder</text>
  <text class="n" x="500" y="308">MiniLM, local</text>
  <text class="n" x="500" y="328">~6 ms</text>

  <rect x="780" y="250" width="240" height="120"/>
  <text x="800" y="284">Moss index</text>
  <text class="n" x="800" y="308">in-process session</text>
  <text class="n" x="800" y="328">20k steps · ~1 ms lookup</text>

  <rect x="1100" y="250" width="272" height="120"/>
  <text x="1120" y="284">Checks</text>
  <text class="n" x="1120" y="308">similar enough · same form state</text>
  <text class="n" x="1120" y="328">target exists · lands correctly</text>

  <rect x="1100" y="480" width="272" height="100"/>
  <text x="1120" y="514">LLM (Groq)</text>
  <text class="n" x="1120" y="538">only when no reflex passes</text>

  <!-- flows -->
  <line x1="180" y1="120" x2="180" y2="250" marker-end="url(#a)"/>
  <text class="lab" x="192" y="190">snapshot</text>

  <line x1="360" y1="300" x2="480" y2="300" marker-end="url(#a)"/>
  <text class="lab" x="378" y="290">lookup</text>

  <line x1="700" y1="310" x2="780" y2="310" marker-end="url(#a)"/>
  <line x1="1020" y1="310" x2="1100" y2="310" marker-end="url(#a)"/>

  <!-- pass: replay -->
  <path d="M1236 250 V180 H280 V120" marker-end="url(#a)"/>
  <text class="lab" x="640" y="170">pass → replay action, no LLM call</text>

  <!-- fail: llm -->
  <line x1="1236" y1="370" x2="1236" y2="480" marker-end="url(#a)"/>
  <text class="lab" x="1248" y="430">fail</text>

  <path d="M1100 530 H100 V370" marker-end="url(#a)"/>
  <text class="lab" x="560" y="520">action from LLM</text>

  <!-- learn -->
  <path d="M260 370 V440 H900 V370" marker-end="url(#a)"/>
  <text class="lab" x="480" y="430">learn: state → action → result</text>
</svg>
</body>
</html>
