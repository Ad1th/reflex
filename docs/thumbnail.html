<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1500px;height:1000px;background:#0b0f14;color:#e8edf3;font-family:-apple-system,"SF Pro Display",Inter,sans-serif;padding:90px 100px;position:relative;overflow:hidden}
.k{font:600 22px "SF Mono",Menlo,monospace;letter-spacing:.2em;color:#8b98a9}
h1{font-size:170px;letter-spacing:-.05em;margin-top:30px;line-height:1}
h1 span{color:#34d399}
p{font-size:42px;line-height:1.25;color:#c9d3df;margin-top:28px;max-width:1300px}
.rows{position:absolute;left:100px;right:100px;bottom:90px;display:flex;gap:22px}
.run{flex:1;background:#121821;border:1.5px solid #253041;border-radius:18px;padding:26px 30px}
.run b{font-size:26px;color:#8b98a9;font-weight:600}.run .v{font-size:60px;font-weight:700;margin-top:6px;letter-spacing:-.03em}
.l{color:#a78bfa}.r{color:#34d399}.m{color:#60a5fa}
.s{font:500 22px "SF Mono",Menlo,monospace;color:#8b98a9;margin-top:6px}
</style></head><body>
<div class="k">BUILT ON MOSS · SUB-MS REFLEX LOOKUP</div>
<h1>Reflex<span>⚡</span></h1>
<p>AI agents that get faster every time they do something twice.</p>
<div class="rows">
 <div class="run"><b>Run 1 · cold</b><div class="v l">11 LLM calls</div><div class="s">🧠 × 10 steps</div></div>
 <div class="run"><b>Run 2 · new details</b><div class="v r">1 LLM call</div><div class="s">⚡ × 10 reflex steps</div></div>
 <div class="run"><b>Moss lookup</b><div class="v m">0.7 ms</div><div class="s">p50 · 20k reflexes</div></div>
</div></body></html>
