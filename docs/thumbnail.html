<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1500px; height:1000px; background:#f4f1ea; color:#141414; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; padding:110px 120px; position:relative; }
  h1 { font-size:150px; font-weight:700; letter-spacing:-.045em; line-height:1; }
  .tag { font-size:40px; line-height:1.3; margin-top:26px; max-width:1100px; color:#2a2a2a; }
  .chart { position:absolute; left:120px; right:120px; bottom:120px; }
  .row { display:grid; grid-template-columns:170px 1fr 250px; align-items:center; column-gap:28px; height:74px; border-top:1.5px solid #141414; }
  .row:last-child { border-bottom:1.5px solid #141414; }
  .k { font-size:26px; }
  .bar { height:22px; background:#141414; }
  .bar.short { width:9%; background:#c2410c; }
  .v { font-family:"SF Mono", Menlo, monospace; font-size:24px; text-align:right; }
  .foot { position:absolute; right:120px; top:118px; font-family:"SF Mono", Menlo, monospace; font-size:20px; color:#555; text-align:right; line-height:1.6; }
</style>
</head>
<body>
  <div class="foot">built on Moss<br>sub-ms step lookup</div>
  <h1>Reflex</h1>
  <div class="tag">AI agents that get faster every time they do something twice.</div>
  <div class="chart">
    <div class="row"><span class="k">First run</span><div class="bar" style="width:100%"></div><span class="v">11 LLM calls</span></div>
    <div class="row"><span class="k">Second run</span><div class="bar short"></div><span class="v">1 LLM call</span></div>
  </div>
</body>
</html>
